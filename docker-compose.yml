services:
  duels:
    build: .
    ports:
      - "8422:8422"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Denver
      - DB_PATH=/data/duels.db
      - PORT=8422
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8422/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
